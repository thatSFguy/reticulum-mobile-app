name: iOS XCFramework

# Phase 1 smoke test: produce shared/build/XCFrameworks/release/Shared.xcframework
# from the KMP shared module. Doesn't ship a binary anywhere yet — just proves
# the iOS targets compile and link cleanly.
#
# Runs only when the shared module or this workflow changes; the Android CI
# already covers everything else and burning macOS minutes on every push to
# androidApp/ is wasteful.
#
# Requires macOS because Kotlin/Native for Apple targets is bound to the
# Xcode toolchain.

on:
  push:
    branches: [master]
    paths:
      - 'shared/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'shared/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

# Least privilege (audit 2026-07-28 M11): compile/link smoke test only —
# never writes repo contents. See android-ci.yml for the rationale.
permissions:
  contents: read

jobs:
  xcframework:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # libopus is a pinned submodule (third_party/opus) built from
          # source for the Opus voice-clip codec — must be checked out.
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: '17'

      # Pin Gradle 8.7 because macos-14 runners' system Gradle is now
      # 9.4.1, which removed `DefaultArtifactPublicationSet` — a class
      # the Android Gradle Plugin still references. Without this pin
      # the bootstrap `gradle wrapper` invocation fails before it can
      # install the project's pinned wrapper.
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.7'

      - name: Bootstrap Gradle wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin
            chmod +x ./gradlew
          fi

      - name: Assemble Shared.xcframework
        run: ./gradlew :shared:assembleSharedXCFramework

      # Phase 4: actually exercise the iOS-side actuals (CryptoKit /
      # CommonCrypto for IosCryptoProvider, libbz2 cinterop, etc.) on
      # the simulator. The runner is Apple Silicon (macos-14), so
      # iosSimulatorArm64Test is the canonical target — runs the
      # compiled K/N test binary natively without booting a sim.
      #
      # The contract suite under
      # shared/src/commonTest/.../crypto/CryptoProviderContractTest.kt
      # pins divergences from the Android contract — including the
      # v1.0.2 outbound-LXMF bug where iOS aesCbcEncrypt double-IV'd
      # the wire token.
      #
      # --stacktrace, and the raw test-results directory alongside the
      # HTML report. Without them this step's only failure mode is
      # "Could not write XML test results for <every class>", which says
      # nothing about WHY: the Kotlin/Native suite runs as one binary,
      # so if it dies before reporting, Gradle has no results for any
      # class and prints that for all of them. Seen twice on 2026-08-30
      # while `Assemble Shared.xcframework` — the actual compile and
      # link of every iOS target — passed in the same job.
      # The K/N suite runs as ONE binary and Gradle's JUnit XML writer
      # has a ~25% chance of choking on its own test-output store:
      # "Could not write XML test results" for every class at once,
      # from either `Multiple entries with same key` in
      # TestOutputStore$IndexBuilder.build or `KryoException: Buffer
      # underflow` reading a truncated store. The tests themselves are
      # fine every time -- `Assemble Shared.xcframework` passes in the
      # same job, and a re-run of the identical commit goes green.
      #
      # NOT Develocity, despite the standing suspicion (2026-09-01): the
      # job exports DEVELOCITY_INJECTION_INIT_SCRIPT_NAME and
      # _CUSTOM_VALUE, but never DEVELOCITY_INJECTION_ENABLED or
      # DEVELOCITY_URL, and this repo has no Develocity plugin or
      # config. The init script has nothing to attach to, so it
      # registers no second listener.
      #
      # Two changes, and they do different jobs:
      #
      #  - `--no-parallel` tests the leading hypothesis. The store is
      #    written by the result processors, `org.gradle.parallel=true`
      #    is set repo-wide, and this job runs a single task chain where
      #    parallelism buys nothing. If the failure rate goes to zero,
      #    that was it.
      #  - The retry is honest mitigation, not a fix, and it is
      #    DELIBERATELY NARROW: it re-runs only when the log carries the
      #    report-writer signature. A real assertion failure exits 1 on
      #    the first attempt and is never retried, so this cannot mask a
      #    broken test.
      - name: Run iOS shared-module tests
        run: |
          set -o pipefail
          run_tests() {
            rm -rf shared/build/test-results/iosSimulatorArm64Test \
                   shared/build/reports/tests/iosSimulatorArm64Test
            ./gradlew :shared:iosSimulatorArm64Test \
              --rerun --no-build-cache --no-parallel --stacktrace 2>&1 \
              | tee /tmp/kn-tests.log
          }
          if run_tests; then exit 0; fi
          if grep -q "Could not write XML test results" /tmp/kn-tests.log; then
            echo "::warning title=K/N report-writer flake::Gradle failed writing test XML, not a test failure. Retrying once."
            run_tests
          else
            echo "::error title=iOS tests failed::Real failure - not the report-writer flake, so not retried."
            exit 1
          fi

      - name: Upload iOS test report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: iosSimulatorArm64Test-report
          path: |
            shared/build/reports/tests/iosSimulatorArm64Test
            shared/build/test-results/iosSimulatorArm64Test
            /tmp/kn-tests.log
          if-no-files-found: warn
          retention-days: 14

      - name: Verify XCFramework structure
        run: |
          set -e
          xcf=shared/build/XCFrameworks/release/Shared.xcframework
          test -d "$xcf" || (echo "XCFramework dir missing"; exit 1)
          ls -1 "$xcf"
          # Each slice should have a Headers/ dir with a generated Shared.h.
          # If any expect-without-actual leaked through, this header is
          # incomplete and downstream Swift consumers fail at import time.
          for slice in "$xcf"/ios-*; do
            test -f "$slice/Shared.framework/Headers/Shared.h" \
              || (echo "missing $slice/Shared.framework/Headers/Shared.h"; exit 1)
          done
          echo "OK"

      - name: Upload XCFramework
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: Shared.xcframework
          path: shared/build/XCFrameworks/release/Shared.xcframework
          if-no-files-found: error
          retention-days: 14
