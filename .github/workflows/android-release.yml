name: Android release

# Push a tag like `android-v0.1.0` to build a signed AAB + APK and attach
# both to a GitHub release. Pattern mirrors the webclient's build-apk.yml.

on:
  push:
    tags:
      - 'android-v*'
  # Manual fallback: `gh workflow run android-release.yml --ref android-vX.Y.Z`.
  # Added after a 2026-05-26 incident where GitHub dropped the push-tag
  # webhook for android-v1.2.35 and the CI never fired automatically.
  # Tag-push remains the primary trigger; this is the escape hatch.
  # dry_run builds and signs without publishing, so a change to this
  # pipeline can be proven before a real release depends on it.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign but do not publish
        type: boolean
        default: false

# Least privilege at the top level. Only the sign job, which runs no
# project code, gets the keystore and contents:write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: '17'

      # Pin Gradle 8.7 — runner images now ship Gradle 9.4.1, which
      # removed `DefaultArtifactPublicationSet` (still referenced by
      # AGP and the KMP iOS-target plumbing). Without the pin the
      # bootstrap step crashes before installing the project's wrapper.
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.7'
          # The Gradle cache is shared with ordinary CI jobs, which run
          # less trusted code. A release job must not restore from it.
          cache-disabled: true

      - name: Bootstrap Gradle wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin
            chmod +x ./gradlew
          fi

      - name: Derive version from tag
        id: version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        # The tag is the source of truth. `build.gradle.kts` reads
        # versionName / versionCode from these `-P` properties and falls
        # back to a clearly-marked `0.0.0-dev` literal for local builds.
        # Wiring it this way means the About screen always reflects the
        # tag; the previous setup required someone to bump the literal
        # in build.gradle.kts before tagging and that step drifted five
        # releases in a row.
        #
        # versionCode math: MA*10000 + MI*100 + PA. So 0.1.92 → 192,
        # 0.2.0 → 200, 1.0.0 → 10000. Monotonic across all reasonable
        # semver bumps because the major axis (×10000) dominates the
        # 0..99 range of minor (×100) and patch (×1). The previous
        # one-per-release counter ran up to versionCode 87; the first
        # CI-built release (0.1.92) lands at 192 — a 105-step jump
        # that's still strictly monotonic, and this app has never
        # shipped on Play (applicationId ends `.native` specifically
        # to avoid clobbering the Play webclient install) so the
        # discontinuity has no real-world consequence.
        run: |
          set -e
          if [ "$DRY_RUN" = "true" ]; then
            TAG="0.0.1"
          else
            TAG="${GITHUB_REF_NAME#android-v}"
          fi
          IFS='.' read -r MA MI PA <<< "$TAG"
          if ! [[ "$MA" =~ ^[0-9]+$ && "$MI" =~ ^[0-9]+$ && "$PA" =~ ^[0-9]+$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match android-vMAJOR.MINOR.PATCH"
            exit 1
          fi
          CODE=$((MA*10000 + MI*100 + PA))
          echo "VERSION_NAME=$TAG"  >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "version_name=$TAG"  >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building $TAG (versionCode=$CODE)"

      - name: Build unsigned AAB and APK
        # --dependency-verification=strict checks every dependency against
        # gradle/verification-metadata.xml. Regenerate that file when a
        # dependency changes, or this step fails.
        run: |
          ./gradlew --dependency-verification=strict \
            :androidApp:bundleRelease :androidApp:assembleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE"

      - name: Hand unsigned artifacts to the signing job
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: unsigned-release
          retention-days: 1
          if-no-files-found: error
          path: |
            androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk
            androidApp/build/outputs/bundle/release/androidApp-release.aab

  sign:
    # Holds the signing key and the write token, so it runs nothing from
    # the project: no Gradle, no plugins, no dependencies. A compromised
    # build tool in the job above can tamper with its own output, but
    # never touches the key.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # softprops/action-gh-release uploads the signed APK/AAB
    env:
      VERSION_NAME: ${{ needs.build.outputs.version_name }}
      VERSION_CODE: ${{ needs.build.outputs.version_code }}
    steps:
      # Only fastlane/ is read from this checkout, as text for the release
      # body. Nothing in it is executed.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch unsigned artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: unsigned-release
          path: unsigned

      - name: Sign AAB and APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS:      ${{ secrets.ANDROID_KEY_ALIAS }}
          # Optional: a single-password keystore leaves this unset.
          RELEASE_KEY_PASSWORD:   ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Set ANDROID_KEYSTORE_BASE64 secret with the base64-encoded keystore."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          export RELEASE_KEY_PASSWORD="${RELEASE_KEY_PASSWORD:-$RELEASE_STORE_PASSWORD}"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK_DIR="androidApp/build/outputs/apk/release"
          AAB_DIR="androidApp/build/outputs/bundle/release"
          mkdir -p "$APK_DIR" "$AAB_DIR"

          UNSIGNED_APK="unsigned/apk/release/androidApp-release-unsigned.apk"
          "$BUILD_TOOLS/zipalign" -c -p 4 "$UNSIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_STORE_PASSWORD --key-pass env:RELEASE_KEY_PASSWORD \
            --out "$APK_DIR/androidApp-release.apk" "$UNSIGNED_APK"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK_DIR/androidApp-release.apk"

          jarsigner -keystore "$KEYSTORE" \
            -storepass:env RELEASE_STORE_PASSWORD -keypass:env RELEASE_KEY_PASSWORD \
            -signedjar "$AAB_DIR/androidApp-release.aab" \
            unsigned/bundle/release/androidApp-release.aab "$RELEASE_KEY_ALIAS"
          jarsigner -verify "$AAB_DIR/androidApp-release.aab" | tail -1
          rm -f "$KEYSTORE"

      - name: Rename artifacts with version suffix
        # AGP outputs `androidApp-release.apk` and
        # `androidApp-release.aab` regardless of versionName, so a
        # tester's Downloads folder can't tell v1.1.2 apart from
        # v1.1.3 when both APKs land there. Rename to
        # `Reticulum-Android-<version>-release.{apk,aab}` so each
        # tag's artifact is self-identifying. Mirrors the iOS-release
        # IPA suffix introduced 2026-05-09.
        run: |
          set -e
          APK_DIR="androidApp/build/outputs/apk/release"
          AAB_DIR="androidApp/build/outputs/bundle/release"
          NEW_APK="Reticulum-Android-${VERSION_NAME}-release.apk"
          NEW_AAB="Reticulum-Android-${VERSION_NAME}-release.aab"
          mv "$APK_DIR/androidApp-release.apk" "$APK_DIR/$NEW_APK"
          mv "$AAB_DIR/androidApp-release.aab" "$AAB_DIR/$NEW_AAB"
          echo "APK_NAME=$NEW_APK" >> "$GITHUB_ENV"
          echo "AAB_NAME=$NEW_AAB" >> "$GITHUB_ENV"
          echo "Renamed → $NEW_APK / $NEW_AAB"

      - name: Compose release body from the fastlane changelog
        # The user-facing summary for every release already exists:
        # fastlane/metadata/android/en-US/changelogs/<versionCode>.txt is
        # written as part of the release cut (see docs(changelog) commits).
        # Lead the release page with it so readers get "what changed" in
        # plain language; generate_release_notes still appends the
        # commit-level "What's Changed" list below. If the file is missing
        # the body is just the auto-notes — a warning, not a failure, so a
        # hotfix tag without a changelog still releases.
        run: |
          set -e
          CHANGELOG="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
          BODY="$RUNNER_TEMP/release-body.md"
          : > "$BODY"
          if [ -f "$CHANGELOG" ]; then
            echo "✓ found $CHANGELOG"
            printf "## What's new in %s\n\n" "$VERSION_NAME" >> "$BODY"
            cat "$CHANGELOG" >> "$BODY"
          else
            echo "::warning::no changelog at $CHANGELOG — release body will be auto-notes only"
          fi
          echo "RELEASE_BODY_PATH=$BODY" >> "$GITHUB_ENV"
          echo "::group::Composed release body"
          cat "$BODY"
          echo "::endgroup::"

      - name: Upload artifacts to release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            androidApp/build/outputs/bundle/release/${{ env.AAB_NAME }}
            androidApp/build/outputs/apk/release/${{ env.APK_NAME }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body_path: ${{ env.RELEASE_BODY_PATH }}
