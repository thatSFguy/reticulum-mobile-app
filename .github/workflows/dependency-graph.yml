name: Dependency graph

# Feeds the resolved Gradle dependency list to GitHub's dependency
# graph, which is what makes Dependabot ALERTS see the Kotlin side at
# all — without a submitted snapshot, GitHub only guesses from manifest
# files it can parse, and a version-catalog / Kotlin-DSL build is mostly
# invisible to it.
#
# Alerts only. Dependabot's *security updates* — the bot that opens
# version-bump PRs — stays off on purpose: an auto-opened bump is a
# delivery mechanism for a poisoned release, and CLAUDE.md's rule is
# that dependency PRs get manual, line-by-line review and are never
# auto-merged. This job notifies; a human decides.
#
# master only: the action writes a snapshot to the repo's dependency
# graph, which a fork PR has no token for anyway.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    permissions:
      # Writing the dependency snapshot is a contents-scoped API.
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up JDK 17
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: '17'

      # Same Gradle 8.7 pin as android-ci.yml, and for the same reason.
      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.7'
