# Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true

# Compose
org.jetbrains.compose.experimental.uikit.enabled=true

# gradle/verification-metadata.xml is enforced on the Android release build
# only (--dependency-verification=strict in android-release.yml). Elsewhere it
# stays lenient: the checksums cover the Linux Android build, and iOS jobs
# resolve macOS-only artifacts that are not listed.
org.gradle.dependency.verification=lenient
